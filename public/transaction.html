<!DOCTYPE html>
<html lang="en">

<head>
    <title>Transaction List Belisoftware.com</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">

    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/custom.css">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

    <!-- Slick -->
    <link rel="stylesheet" type="text/css" href="assets/css/slick.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/slick-theme.css">
    <style>.overlay {

        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
        background: #00000091;
        z-index: 9;
    }

    .overlay img {
        position: absolute;
        right: 50%;
        bottom: 50%;
        transform: translate(50%, 50%);
    }

    </style>
</head>

<body>

<div data-component="header"></div>

<!-- Open Content -->
<section class="bg-light">
    <div class="container">
        <div class="row py-5">
            <div class="col-lg-3 col-md-4 mb-3">
                <div data-component="account-sidebar"></div>
            </div>
            <div class="col-lg-9 col-md-8">
                <h3 class="h3 card-title">Transaction List</h3>
                <div id="mainContent"></div>
            </div>
        </div>
    </div>
</section>
<!-- Close Content -->

<div data-component="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/custom.js"></script>
<!-- End Script -->

<!-- Start Slider Script -->
<script src="assets/js/slick.min.js"></script>
<script src="assets/js/currency.js"></script>
<script src="assets/js/component.js"></script>
<!-- End Slider Script -->

<!--firebase-->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/user-auth.js"></script>
<script>
  function getStatus(statusNumber){
    var status = {
      "0": "Pending",
      "1": "Paid",
      "2": "Process",
      "3": "Delivery",
      "4": "Arrived",
      "5": "Confirmed",
      "6": "Failed",
      "7": "Refund",
    };
    return status[statusNumber];
  }
  $(function () {
    var dateFormat = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

    firebase.auth().onAuthStateChanged((user) => {
      fetch(firebaseConfig.databaseURL + "/" + TABLE_ORDERS + "/" + user.uid + ".json")
        .then(resp => resp.json())
        .then(invoices => {
          if(!invoices){
            $(document).find("#mainContent").append("No order yet");
            return;
          }
          for (var i in invoices) {
            var items = invoices[i];
            var invoiceId = items[0].invoiceId;
            var time = items[0].timestamp;
            var status = getStatus(items[0].status);
            $(document).find("#mainContent").append(
              '<div class="card mb-3" id="' + invoiceId + '">' +
              '<div class="card-header">' +
              '<div>Invoice Number: ' + invoiceId + '</div>' +
              '</div> ' +
              '<div class="card-body"> ' +
              '<div class="mb-3"><b>Status</b>: '+status+'</div>' +
              '<div class="mb-3"><b>Date</b>: '+new Date(time).toLocaleDateString("en-US", dateFormat)+'</div>' +
              '<div class="mb-3"><b>Total</b>: <span class="total"></span> </div>' +
              '<table class="table table-bordered table-sm">' +
              '<thead><tr><th>Item</th><th>Quantity</th></tr></thead>' +
              '<tbody></tbody>' +
              '</table>' +
              '<div></div>' +
              '</div>' +
              '</div>'
            );
            var total = 0;
            for(var j in items){
              var item = items[j];
              $(document).find("#"+invoiceId).find("table tbody").append('<tr>' +
                '<td>'+item.name+'</td>' +
                '<td>'+item.quantity+'</td>' +
                '</tr>');
              total += (item.price*item.quantity);
            }
            $(document).find("#"+invoiceId).find(".total").text(currencyFormat.format(total));
          }
        });
    });
  })
</script>
</body>

</html>
