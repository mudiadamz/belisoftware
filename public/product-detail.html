                                    <button class="btn btn-success btn-lg" id="checkoutBtn" type="button">Check out
                                        </a>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>

<!-- End Slider Script -->

<!--firebase-->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/currency.js"></script>
<script src="assets/js/component.js"></script>
<script>


  $(function () {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    firebase.database().ref(TABLE1 + "/" + id).on('value', (snapshot) => {
      const item = snapshot.val();
      $(document).find("#productDetailImg").addClass(item.photo);
      loadImage(item.photo)
      $(document).find("#name").text(item.name);
      $(document).find("#description").text(item.description);
      $(document).find("#price").data("price", item.price).text(currencyFormat.format(item.price));
    });

    $(document).on("click", "#checkoutBtn", function (e) {
      e.preventDefault();
      var item = {
        id: id, name: $(document).find("#name").text(),
        quantity: 1, price: parseFloat($(document).find("#price").data("price"))
      };
      localStorage.setItem("cart", JSON.stringify([item]));
      window.location.href = "checkout.html";
    })
  });

</script>
</body>

</html>
