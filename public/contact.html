<!DOCTYPE html>
<html lang="en">

<head>
    <title>Belisoftware.com - Contact</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/custom.css">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

    <!-- Load map styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
          integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
          crossorigin=""/>
</head>

<body>

<div data-component="header"></div>


<!-- Start Contact -->
<div class="container py-5">
    <div class="row">
        <form class="col-md-9 m-auto" method="post" role="form" id="mainForm">

            <h1 class="h1">Contact Us</h1>
            <p>
                Should you need any further information, please do not hesitate to contact us.

            </p>

            <div class="row">
                <div class="form-group col-md-6 mb-3">
                    <label for="name">Name</label>
                    <input type="text" class="form-control mt-1" id="name" name="name" placeholder="Name" required
                           minlength="3">
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="email">Email</label>
                    <input type="email" class="form-control mt-1" id="email" name="email" placeholder="Email" required
                           minlength="8">
                </div>
            </div>
            <div class="mb-3">
                <label for="message">Message</label>
                <textarea class="form-control mt-1" id="message" name="message" placeholder="Message"
                          rows="8" required minlength="20"></textarea>
            </div>
            <div class="row">
                <div class="col text-end mt-2">
                    <button type="submit" class="btn btn-primary btn-lg px-3">Submit</button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- End Contact -->

<div data-component="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/custom.js"></script>
<script src="assets/js/component.js"></script>
<!-- End Script -->
<script>
  $(document).on("submit", "#mainForm", function (e) {
    e.preventDefault();
    $(this).find("[type='submit']").prop("disabled", true);
    fetch("/contact").then(resp => resp.json()).catch(error => {
      window.alert("Your message is submitted. Thank you for your feedback!");
      $(this).find("[type='submit']").prop("disabled", false);
    });
  })
</script>
</body>

</html>
